<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch — Professor Skieth's League</title>
<link rel="stylesheet" href="style.css">
<style>
  .viewer { background: #fff; color: #000; border-radius: 12px; padding: 10px 0; margin-top: 14px; overflow: hidden; font-family: Verdana, sans-serif; font-size: 10pt; }
  .viewer .wrapper { max-width: 1180px; margin: 0 auto; }
</style>
<!-- pako: synchronous gunzip, so the replay is in the page before Showdown's player loads -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="index.html">Professor <span>Skieth</span>'s League</a>
    <nav><a href="index.html">Gauntlet</a><a href="league.html">League battles</a></nav>
  </header>
<script>
// Everything here runs while the page is still loading, like a downloaded Showdown replay file.
(function () {
  function getBytes(url) {
    var x = new XMLHttpRequest();
    x.open('GET', url, false);
    x.overrideMimeType('text/plain; charset=x-user-defined');
    x.send(null);
    if (x.status !== 200 && x.status !== 0) throw new Error('HTTP ' + x.status);
    var s = x.responseText, b = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) b[i] = s.charCodeAt(i) & 0xff;
    return b;
  }
  function getText(url) {
    var b = getBytes(url);
    if (b[0] === 0x1f && b[1] === 0x8b) return pako.ungzip(b, {to: 'string'});
    return new TextDecoder().decode(b);
  }
  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  var q = new URLSearchParams(location.search), log, title, sub, prev = null, next = null, back;
  try {
    if (q.get('l')) {
      var id = q.get('l');
      log = getText('league/' + id + '.log.gz');
      var list = JSON.parse(getText('data/league.json'));
      var i = list.findIndex(function (x) { return x.id === id; }), g = list[i];
      title = g.p1 + ' vs. ' + g.p2;
      sub = (g.phase === 'gym-league' ? 'Gym league' : 'Round robin') + ' · ' + id + ' · winner ' + g.winner + ' · ' + g.turns + ' turns';
      if (i > 0) prev = 'watch.html?l=' + list[i - 1].id;
      if (i < list.length - 1) next = 'watch.html?l=' + list[i + 1].id;
      back = ['league.html', 'All league battles'];
    } else {
      var r = parseInt(q.get('r') || '1'), gi = parseInt(q.get('g') || '0');
      var run = JSON.parse(getText('runs/run-' + String(r).padStart(4, '0') + '.json.gz'));
      var gm = run.games[gi];
      log = gm.log;
      var where = gm.stage === 'Champion' ? 'Title match vs. Champion Nexus' : 'Gym ' + gm.badge + ' · ' + gm.stageName.replace('Gym Leader ', '');
      title = where + ' · Game ' + gm.game;
      var volt = gm.p1.indexOf('Volt') === 0 ? gm.p1 : gm.p2;
      sub = 'Run ' + r + ' · ' + volt + ' · ' + (gm.won ? 'Volt wins' : 'Volt loses') + ' in ' + gm.turns + ' turns';
      if (gi > 0) prev = 'watch.html?r=' + r + '&g=' + (gi - 1);
      if (gi < run.games.length - 1) next = 'watch.html?r=' + r + '&g=' + (gi + 1);
      back = ['run.html?r=' + r, 'Run ' + r + ' overview'];
    }
  } catch (e) {
    document.write('<h1 style="font-size:24px">Battle not found.</h1><p class="sub">It may still be uploading. Try again in a few minutes.</p>');
    return;
  }
  document.title = title + " — Professor Skieth's League";
  document.write('<h1 style="font-size:24px">' + esc(title) + '</h1><p class="sub">' + esc(sub) + '</p><div>' +
    '<a class="btn ghost" href="' + esc(back[0]) + '">← ' + esc(back[1]) + '</a> ' +
    (prev ? '<a class="btn ghost" href="' + esc(prev) + '">Previous battle</a> ' : '') +
    (next ? '<a class="btn ghost" href="' + esc(next) + '">Next battle</a>' : '') + '</div>');
  // Showdown's standard replay structure, with the log inline.
  document.write('<div class="viewer"><div class="wrapper replay-wrapper"><input type="hidden" name="replayid" value="skieth" />' +
    '<div class="battle"></div><div class="battle-log"></div><div class="replay-controls"></div><div class="replay-controls-2"></div>' +
    '<script type="text/plain" class="battle-log-data">' + log.replace(/<\//g, '<\\/') + '\n</' + 'script></div></div>' +
    '<div class="battle-log battle-log-inline"><div class="inner"></div></div>');
  var daily = Math.floor(Date.now() / 1000 / 60 / 60 / 24);
  document.write('<script src="https://play.pokemonshowdown.com/js/replay-embed.js?version' + daily + '"></' + 'script>');
})();
</script>
  <p class="muted" style="font-size:12px;margin-top:12px">Playback uses Pokémon Showdown's official replay viewer, loaded from play.pokemonshowdown.com.</p>
</div>
</body>
</html>
